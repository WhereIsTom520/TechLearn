name: Export Browser Agent Overlay

on:
  push:
    branches:
      - artifact/browser-agent-stage1-easy-v0.1.6
    paths:
      - .github/workflows/export-overlay.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create overlay archive
        run: |
          rm -rf .git
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path('.').resolve()
          out = root / 'browser_agent_stage1_v0.1.6_overlay.zip'
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for p in sorted(root.rglob('*')):
                  if not p.is_file() or p == out:
                      continue
                  z.write(p, p.relative_to(root).as_posix())
          print(out)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: browser_agent_stage1_v0.1.6_overlay
          path: browser_agent_stage1_v0.1.6_overlay.zip
          if-no-files-found: error
          retention-days: 7

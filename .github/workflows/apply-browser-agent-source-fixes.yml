name: Apply Browser Agent Source Fixes

on:
  push:
    branches:
      - "artifact/browser-agent-stage1-easy-v0.1.6"
    paths:
      - "scripts/apply_v016_source_fixes.py"
      - "scripts/easy_launcher.py"
      - ".github/workflows/apply-browser-agent-source-fixes.yml"

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: artifact/browser-agent-stage1-easy-v0.1.6
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Apply deterministic source fixes
        run: python scripts/apply_v016_source_fixes.py
      - name: Compile repaired source
        run: python -m py_compile scripts/easy_launcher.py
      - name: Commit repaired source when changed
        run: |
          if git diff --quiet; then
            echo "Source already repaired"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/easy_launcher.py
          git commit -m "fix: apply direct Stage-1 launcher source repairs"
          git push origin HEAD:artifact/browser-agent-stage1-easy-v0.1.6
